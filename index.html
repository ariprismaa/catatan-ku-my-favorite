<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Ku Pribadi</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <header>
    <h1>📝 Catatan Saya Pribadi</h1>
    <div>
      <span id="userEmail"></span>
      <button id="logoutBtn">Keluar</button>
    </div>
  </header>

  <div class="note-form">
    <input type="text" id="noteTitle" placeholder="Judul catatan..." required>
    <textarea id="noteContent" placeholder="Isi catatan..." rows="4" required></textarea>
    <button id="saveNote">💾 Simpan Catatan Permanen</button>
  </div>

  <div id="notesList" class="notes-container">
    <p class="info">Memuat catatanmu...</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
